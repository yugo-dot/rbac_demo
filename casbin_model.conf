# Casbin 模型定义 (ABAC 模式)
# 请求: 主体(带属性的 dict) / 对象(带属性的 dict) / 动作
[request_definition]
r = sub, obj, act

# 策略: 主体条件表达式 / 对象(资源类型) / 动作
[policy_definition]
p = sub_rule, obj, act

# 效果: 任意一条策略匹配就放行
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器: sub_rule 是条件表达式, 用 simpleeval 求值
# r.sub / r.obj 是带属性的 dict, 可以直接访问字段
[matchers]
m = eval(p.sub_rule) && r.obj.obj_type == p.obj && (p.act == "*" || r.act == p.act)
