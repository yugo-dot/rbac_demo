version: "1.0"
name: CI
displayName: CI
stages:
- name: test
  displayName: Test
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: test
    displayName: Django Tests
    pythonVersion: "3.12"
    commands:
    - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
    - pip install -r requirements-ci.txt
    - USE_SQLITE=true DJANGO_SETTINGS_MODULE=config.settings.dev python manage.py test users rbac articles
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - main
notify: []
strategy:
  blocking: true
